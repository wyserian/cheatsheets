<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14161a">

    <title>Page Not Found</title>
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('cheatsheet-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'))}catch(e){}</script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Absolute paths: this page can be served from any URL depth -->
    <link rel="stylesheet" href="/cheatsheets/assets/css/style.css?v=12">

    <style>
        .error-page {
            max-width: 1240px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 12px 16px 48px;
            display: flex;
            flex-direction: column;
        }

        .error-top {
            display: flex;
            justify-content: flex-end;
            min-height: 40px;
        }

        .error {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            width: 100%;
            max-width: 480px;
            padding: 36px 28px;
            border-radius: 12px;
            background: var(--card);
            text-align: center;
        }

        .error-code {
            margin: 0 0 6px;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.03em;
            color: var(--heading);
        }

        .error-code .hash {
            color: var(--accent);
        }

        .error-title {
            margin: 0 0 10px;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--heading);
        }

        .error-message {
            margin: 0 0 24px;
            color: var(--text-muted);
        }

        .home-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 44px;
            padding: 0 18px;
            border-radius: var(--radius);
            background: var(--surface-2);
            color: var(--heading);
            font-weight: 500;
            transition: background var(--transition);
        }

        .home-btn i {
            color: var(--accent);
        }

        .home-btn:hover {
            background: var(--border);
            color: var(--heading);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-top">
            <button class="theme-toggle" type="button" aria-label="Toggle theme"><i class="bi bi-sun" aria-hidden="true"></i></button>
        </div>

        <main class="error">
            <div class="error-card">
                <p class="error-code"><span class="hash">#</span>404</p>
                <h1 class="error-title">Page not found</h1>
                <p class="error-message">The page you're looking for doesn't exist or has been moved.</p>
                <a href="/cheatsheets" class="home-btn">
                    <i class="bi bi-grid-3x3-gap-fill" aria-hidden="true"></i>
                    All Cheatsheets
                </a>
            </div>
        </main>
    </div>

    <script src="/cheatsheets/assets/js/script.js?v=9"></script>
</body>

</html>
